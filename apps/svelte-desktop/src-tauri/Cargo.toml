[package]
name = "pi-desktop"
version = "0.0.0"
description = "Pi Desktop — Svelte + Tauri tracer bullet"
authors = []
edition = "2021"
rust-version = "1.77"

[lib]
name = "pi_desktop_lib"
crate-type = ["lib", "cdylib", "staticlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["default"] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
